name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: "APK de debug"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      # Los runners de GitHub ya traen el SDK de Android instalado.
      - run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: desastres-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # El artifact del workflow solo se puede bajar con sesion iniciada en
      # GitHub y llega comprimido en un zip, que en un celular es incomodo.
      # El release deja un .apk con link directo, instalable desde el telefono.
      - name: "Publicar el APK en el release apk-ultimo"
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          nombre="desastres-${GITHUB_SHA:0:7}.apk"
          cp "$apk" "$nombre"
          gh release delete apk-ultimo --yes --cleanup-tag || true
          gh release create apk-ultimo "$nombre" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APK de prueba (ultimo build)" \
            --notes "APK de debug armado desde \`${GITHUB_REF_NAME}\` (${GITHUB_SHA:0:7}).

          Para instalarlo hay que permitir \"instalar apps de origenes desconocidos\" en el celular. Es una build de debug, sin firmar para produccion."
